<!doctype html>
<!-- Стенд для проверки жеста выделения (удержал слово → повёл пальцем → фраза).
     Открывается только на dev-сервере, в сборку не попадает: vite собирает index.html.
     Как прогнать:
       cd frontend && npx vite --port 5199 --strictPort &
       node ~/.claude/skills/browser-automation/browser.mjs \
            http://localhost:5199/dev/gesture-check.html --script ./dev/gesture-drag-qa.mjs
     Что должно выйти: afterHold — подсвечено 1 слово; afterDrag — 4 слова;
     afterRelease — «Trotz des schlechten Wetters», тип translation_result_phrase;
     probe.prevented == probe.moves за время выделения (прокрутка отобрана у страницы);
     scrollGesture — ни выделения, ни отмены (быстрый свайп остаётся прокруткой);
     tap — одно слово «des». -->
<html><head><meta charset="utf-8"><title>gesture check</title>
<style>
  body { margin:0; font: 17px/1.7 -apple-system, system-ui, sans-serif; }
  #scroller { height: 240px; overflow-y: auto; padding: 12px; border: 1px solid #ccc; }
  #spacer { height: 800px; }
  .reader-word { -webkit-user-select:none; user-select:none; }
  .reader-word.is-selected { background: rgba(92,196,255,.35); }
</style>
</head><body>
<div id="scroller"><div id="root"></div><div id="spacer"></div></div>
<script type="module" src="/src/dev/gestureCheck.jsx"></script>
</body></html>
